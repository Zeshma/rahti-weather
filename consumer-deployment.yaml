apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahti-weather-consumer
  labels:
    app: rahti-weather-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rahti-weather-consumer
  template:
    metadata:
      labels:
        app: rahti-weather-consumer
    spec:
      containers:
      - name: rahti-weather-consumer
        # Replace testproject-10 with your OpenShift project name, or use the
        # external registry URL image-registry.apps.2.rahti.csc.fi/testproject-10/rahti-weather:latest
        image: image-registry.openshift-image-registry.svc:5000/testproject-10/rahti-weather:latest
        ports:
        - containerPort: 8082
          name: consumer
        env:
        - name: COMPONENT
          value: "consumer"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        # KAFKA_DISABLED is disabled in this Kafka-mandatory deployment.
        # Uncomment to re-enable the direct-DB fallback path.
        # - name: KAFKA_DISABLED
        #   value: "false"
        # The Kafka deployment in kafka-deployment.yaml uses PLAINTEXT listeners
        # (no SASL). If your Kafka uses SASL/SCRAM, set these accordingly:
        #   KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT
        #   KAFKA_SASL_MECHANISM=SCRAM-SHA-256
        #   KAFKA_USERNAME=<your-user>
        #   KAFKA_PASSWORD=<your-password>
        - name: KAFKA_SECURITY_PROTOCOL
          value: "PLAINTEXT"
        - name: KAFKA_SASL_MECHANISM
          value: "PLAIN"
        # Database credentials: must match the PostgreSQL deployment.
        #   oc set env deployment/rahti-weather-consumer \
        #     DB_USER=<your-user> DB_PASSWORD=<your-password> DB_NAME=<your-db>
        - name: DB_HOST
          value: "postgresql"
        - name: DB_PORT
          value: "5432"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rahti-weather-consumer
  labels:
    app: rahti-weather-consumer
spec:
  ports:
  - port: 8082
    name: consumer
  selector:
    app: rahti-weather-consumer
