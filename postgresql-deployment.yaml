apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: docker.io/bitnamilegacy/postgresql:15.3.0
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        # Replace the placeholder values below with your own credentials before
        # applying, or set them after deploying with:
        #   oc set env deployment/postgresql \
        #     POSTGRESQL_USERNAME=<your-user> \
        #     POSTGRESQL_PASSWORD=<your-password> \
        #     POSTGRESQL_DATABASE=<your-db>
        # The app deployments must use matching DB_USER/DB_PASSWORD/DB_NAME values.
        - name: POSTGRESQL_USERNAME
          value: "<your-user>"
        - name: POSTGRESQL_PASSWORD
          value: "<your-password>"
        - name: POSTGRESQL_DATABASE
          value: "<your-db>"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        readinessProbe:
          exec:
            command:
            - /opt/bitnami/postgresql/bin/pg_isready
            - -U
            - postgres
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - /opt/bitnami/postgresql/bin/pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgresql-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app: postgresql
spec:
  ports:
  - port: 5432
    name: postgresql
  selector:
    app: postgresql